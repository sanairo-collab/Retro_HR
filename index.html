<body class="bg-slate-950 text-slate-100 min-h-screen w-screen flex flex-col justify-between p-1.5 sm:p-2">

 <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">

 <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">

  <button id="mpCreate">방 만들기</button><input id="mpCode" maxlength="6" placeholder="방 코드" style="width:90px;padding:7px;text-transform:uppercase;background:#020617;color:white;border:1px solid #475569;border-radius:8px">

 </div>
 <div id="mpRoom" hidden style="margin-top:10px;padding-top:10px;border-top:1px solid #334155">
  <div>방 <b id="mpRoomNameDisplay" style="color:#f8fafc"></b> · <b id="mpRoomCode" style="color:#fbbf24"></b> · <span id="mpPhase"></span> · 참가자 <span id="mpCount"></span></div>

   <button id="mpLeave">나가기</button>
  </div>
  <div id="mpResults" style="margin-top:8px;color:#fbbf24"></div>
 </div>
</section>

<main class="flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-1.5 my-1 min-h-0">
 <div class="lg:col-span-3 bg-slate-900 rounded-xl p-1 border border-slate-800/80 flex flex-col justify-between relative overflow-hidden h-[260px] sm:h-[340px] lg:h-[calc(100vh-70px)] min-h-[250px]">

   <div id="resultModal" class="absolute inset-0 bg-slate-950/85 hidden items-center justify-center p-2 z-30">

     <div class="text-xl">🏆</div><h2 class="text-sm sm:text-base font-black text-amber-400 font-jua">시상식 및 최종 순위</h2>
     <div id="podiumList" class="space-y-1 my-1.5 text-left text-[11px] sm:text-xs overflow-y-auto min-h-0 flex-1"></div>
     <button id="modalRestartBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black py-1.5 rounded-xl font-jua text-xs border border-amber-300">🔄 한 게임 더 하기!</button>
    </div>
   </div>
  </div>
  <div class="mt-1 bg-slate-950/95 px-2.5 py-0.5 rounded-lg border border-slate-800 flex items-center justify-between text-[11px] shrink-0">
   <div id="gameStatusText" class="font-jua text-amber-300 truncate">🚩 [경주 스타트] 버튼을 누르면 경주가 시작됩니다!</div>
   <div id="raceTimer" class="font-mono text-amber-400 font-extrabold whitespace-nowrap ml-2 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">⏱️ 00.00초</div>
  </div>
 </div>
 <div class="hidden sm:flex lg:col-span-1 bg-slate-900 rounded-xl p-2 border border-slate-800/80 flex-col min-h-0 overflow-hidden h-[260px] lg:h-[calc(100vh-70px)]">
  <h2 class="text-xs font-extrabold text-amber-400 font-jua border-b border-slate-800 pb-1 mb-1.5 flex items-center justify-between shrink-0"><span>📊 실시간 라이브 순위</span><span id="liveStatusBadge" class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded-full">대기 중</span></h2>
  <div id="leaderboardList" class="flex-1 space-y-1 overflow-y-auto min-h-0"></div>
 </div>
</main>

<script>
const COLORS=[
{name:"레드 썬더",hex:"#ef4444",coat:"#a0522d",dark:"#70391e",mane:"#3e1f10",blaze:1},
{name:"블루 스톰",hex:"#3b82f6",coat:"#cd853f",dark:"#9a632f",mane:"#5c3a1c",blaze:0},
{name:"골든 차크라",hex:"#f59e0b",coat:"#d4a373",dark:"#a0784d",mane:"#604020",blaze:1},
{name:"에메랄드 윈드",hex:"#10b981",coat:"#bc8f8f",dark:"#8b6969",mane:"#5c4646",blaze:0},
{name:"퍼플 갤럭시",hex:"#a855f7",coat:"#deb887",dark:"#b89768",mane:"#fff8dc",blaze:1},
{name:"오렌지 블레이즈",hex:"#f97316",coat:"#cd5c5c",dark:"#8b3a3a",mane:"#5c2626",blaze:0},
{name:"핑크 메테오",hex:"#ec4899",coat:"#f4a460",dark:"#b8733d",mane:"#5c3a1c",blaze:1},
{name:"시안 라이트닝",hex:"#06b6d4",coat:"#d2b48c",dark:"#a0784d",mane:"#5c3a1c",blaze:0},
{name:"라임 스프린트",hex:"#84cc16",coat:"#c19a6b",dark:"#8b6941",mane:"#4a3520",blaze:1},
{name:"크림슨 발키리",hex:"#e11d48",coat:"#d2691e",dark:"#a55217",mane:"#6b360f",blaze:0}];

const $=id=>document.getElementById(id);
const canvas=$('raceCanvas'),ctx=canvas.getContext('2d');
const horseCountSelect=$('horseCountSelect'),horseScaleRange=$('horseScaleRange'),startBtn=$('startBtn'),leaderboardList=$('leaderboardList'),gameStatusText=$('gameStatusText'),raceTimer=$('raceTimer'),liveStatusBadge=$('liveStatusBadge'),resultModal=$('resultModal'),podiumList=$('podiumList');

let soundEnabled=true,audioCtx=null;
function initAudio(){if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function playHoof(){if(!soundEnabled||!audioCtx)return;try{const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(80+Math.random()*40,t);o.frequency.exponentialRampToValueAtTime(20,t+.05);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(t+.05)}catch(e){}}
function playFanfare(){if(!soundEnabled||!audioCtx)return;try{[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+.35);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+.35)})}catch(e){}}
$('soundToggleBtn').addEventListener('click',()=>{soundEnabled=!soundEnabled;$('soundIcon').textContent=soundEnabled?'🔊':'🔇';$('soundText').textContent=soundEnabled?'사운드 ON':'사운드 OFF';if(soundEnabled)initAudio()});

let wakeLock=null;
async function reqWake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){if(wakeLock){wakeLock.release().then(()=>wakeLock=null).catch(()=>{})}}

let numHorses=5,horseScale=.85,horses=[],particles=[],isRacing=false,isFinished=false,raceStartedAt=0,raceSeed=1,elapsedTime=0,finishOrder=[],raceLaunched=false,officiallyFinished=false;
let PAD_L=125,PAD_R=75;let finishLineX=0;

function dust(x,y,color='#64748b',n=1){
 if(particles.length>12)return;
 for(let i=0;i<n;i++) particles.push({x:x+(Math.random()-.5)*4, y:y+(Math.random()-.5)*2, vx:-0.3-Math.random()*0.5, vy:-0.1-Math.random()*0.2, r:0.8+Math.random()*1.0, a:0.35+Math.random()*0.2, c:color});
}
function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.a-=dt*1.5;p.r+=dt*1.5;if(p.a<=0){particles.splice(i,1);continue}ctx.save();ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();ctx.restore()}}

function leg(c,hx,hy,p,front,col,w){
 const sw=Math.sin(p),lift=Math.max(0,Math.cos(p));
 const a1=sw*(front?.8:.7);
 const a2=front?a1-.15-lift*1.25:a1+.35-lift*.9;
 const L1=front?11:8,L2=front?11:9.5;
 const kx=hx+Math.sin(a1)*L1,ky=hy+Math.cos(a1)*L1;
 const a3=front?a2+.25*lift:a2-.45;
 const fx=kx+Math.sin(a2)*L2,fy=ky+Math.cos(a2)*L2;
 const hfx=fx+Math.sin(a3)*3.5,hfy=fy+Math.cos(a3)*3.5;
 c.lineCap='round';c.lineJoin='round';c.strokeStyle=col;
 c.lineWidth=w;c.beginPath();c.moveTo(hx,hy);c.lineTo(kx,ky);c.stroke();
 c.lineWidth=w*.62;c.beginPath();c.moveTo(kx,ky);c.lineTo(fx,fy);c.stroke();
 c.lineWidth=w*.5;c.strokeStyle="#161010";c.beginPath();c.moveTo(fx,fy);c.lineTo(hfx,hfy);c.stroke();
}

function raceRandom(seed,horseId,slot){
 let x=(Number(seed)^Math.imul(horseId,0x9e3779b1)^Math.imul(slot+1,0x85ebca6b))>>>0;
 x=Math.imul(x^(x>>>16),0x7feb352d);x=Math.imul(x^(x>>>15),0x846ca68b);x^=x>>>16;
 return (x>>>0)/4294967296;
}
function raceStatusAt(horseId,t){
 let status='normal';const sec=Math.floor(t);
 for(let s=Math.max(0,sec-1);s<=sec;s++)if(raceRandom(raceSeed,horseId,10000+s*2)<.075&&t<s+2)status=raceRandom(raceSeed,horseId,10001+s*2)<.5?'injured':'tired';
 return status;
}
function raceProgress(horseId,t,trackWidth){
 const target=600,step=.2,scale=60;let distance=0,finishAt=null;
 const count=Math.ceil(Math.max(0,t)/step);
 for(let i=0;i<count&&distance<target;i++){
  const from=i*step,duration=Math.min(step,t-from),mid=from+duration/2,status=raceStatusAt(horseId,mid);
  const velocity=(.35+raceRandom(raceSeed,horseId,i)*.2)*scale*(status==='injured'?0:status==='tired'?.4:1);
  if(velocity>0&&distance+velocity*duration>=target){finishAt=from+(target-distance)/velocity;distance=target;break}
  distance+=velocity*duration;
 }
 return {distance:distance/target,status:raceStatusAt(horseId,t),finishAt};
}

class Horse{
 constructor(id,col){this.id=id;this.col=col;this.reset(0)}
 reset(y){
  this.x=PAD_L;this.y=y;this.speed=0;
  this.baseSpeed=0.42;
  this.phase=Math.random()*6.28;this.phaseStart=this.phase;this.status='normal';this.timer=0;this.rank=0;this.finished=false;this.finishTime=0;this.chg=Math.random()*40
 }
 update(dt,tw){
  if(!isRacing||this.finished)return;
  const progress=raceProgress(this.id,elapsedTime,tw);
  this.status=progress.status;this.x=PAD_L+progress.distance*(finishLineX-PAD_L);
  this.speed=(.35+raceRandom(raceSeed,this.id,Math.floor(elapsedTime/.2))*.2)*(tw/750)*(this.status==='injured'?0:this.status==='tired'?.4:1);
  this.phase=this.phaseStart+elapsedTime*55;
  if(progress.finishAt!==null&&elapsedTime>=progress.finishAt&&!this.finished){
   this.finished=true;this.x=finishLineX;this.finishTime=progress.finishAt;finishOrder.push(this);
   finishOrder.sort((a,b)=>a.finishTime-b.finishTime||a.id-b.id);finishOrder.forEach((h,i)=>h.rank=i+1);dust(this.x,this.y,'#f59e0b',6);
  }
 }
 draw(c){
  const k=this.col,p=this.phase,moving=this.speed>0&&this.status!=='injured';
  const bob=moving?Math.sin(p*2)*.4:0;
  
  c.save();c.translate(this.x,this.y);c.scale(horseScale,horseScale);
  
  if(this.status==='injured'){
   c.rotate(.05);
   c.fillStyle="#ef4444";c.font="bold 28px sans-serif";c.textAlign="center";c.fillText("⚠️",0,-46+bob);
  } else if(this.status==='tired'){
   c.fillStyle="#3b82f6";c.font="bold 28px sans-serif";c.textAlign="center";c.fillText("💧",0,-46+bob);
  }
  
  if(moving)c.rotate(Math.sin(p)*.012);
  c.fillStyle="rgba(255,255,255,.1)";c.beginPath();c.ellipse(0,12,30,4,0,0,6.283);c.fill();
  
  const b=bob,far=k.dark;
  leg(c,-17,-9+b,p+Math.PI+.9,false,far,6);
  leg(c,15,-9+b,p-.9,true,far,4.6);
  
  c.strokeStyle=k.mane;c.lineCap='round';
  for(let i=0;i<3;i++){c.lineWidth=3-i*.6;c.beginPath();c.moveTo(-25,-22+b);c.bezierCurveTo(-28,-23+i*1,-31+Math.sin(p+i)*1,-19+i*1,-34+Math.sin(p*1.5+i*.6)*1.5,-12+i*1.5);c.stroke()}
  
  const g=c.createLinearGradient(0,-29,0,-4);g.addColorStop(0,k.coat);g.addColorStop(1,k.dark);
  c.fillStyle=g;c.beginPath();
  c.moveTo(-27,-16+b);c.bezierCurveTo(-28,-27+b,-13,-28+b,-3,-25+b);
  c.bezierCurveTo(5,-24+b,13,-27+b,20,-27+b);c.bezierCurveTo(28,-25+b,29,-14+b,23,-6+b);
  c.bezierCurveTo(14,-2+b,0,-5+b,-8,-6+b);c.bezierCurveTo(-20,-3+b,-28,-7+b,-27,-16+b);c.fill();
  
  c.fillStyle="rgba(0,0,0,.18)";c.beginPath();c.ellipse(-16,-14+b,9,8,-.3,0,6.283);c.fill();
  c.beginPath();c.ellipse(14,-15+b,6,8,.2,0,6.283);c.fill();
  
  c.fillStyle=g;c.beginPath();
  c.moveTo(13,-26+b);c.bezierCurveTo(19,-35+b,23,-41+b,27,-44+b);
  c.lineTo(32,-38+b);c.bezierCurveTo(29,-30+b,28,-20+b,25,-10+b);c.closePath();c.fill();
  
  c.fillStyle=k.coat;c.beginPath();
  c.moveTo(27,-44+b);c.bezierCurveTo(32,-45+b,38,-40+b,44,-33+b); 
  c.bezierCurveTo(46,-30+b,44,-28+b,41,-28.5+b);c.bezierCurveTo(38,-30+b,34,-31+b,31,-35+b);
  c.bezierCurveTo(29,-39+b,28,-39+b,27,-44+b);c.fill();
  
  if(k.blaze){c.strokeStyle="rgba(255,255,255,.75)";c.lineWidth=1.4;c.beginPath();c.moveTo(31,-43.5+b);c.lineTo(42,-33.5+b);c.stroke()}
  
  c.fillStyle=k.dark;c.beginPath();c.ellipse(43.5,-31+b,2.4,2,.6,0,6.283);c.fill();
  c.fillStyle="#000";c.beginPath();c.arc(44.1,-32+b,.6,0,6.283);c.fill();
  c.fillStyle="#0b0b0b";c.beginPath();c.ellipse(33,-39.5+b,1.4,1,.3,0,6.283);c.fill();
  c.fillStyle="#fff";c.fillRect(33.3,-40.2+b,.5,.5);
  
  c.fillStyle=k.coat;c.beginPath();c.moveTo(27,-43+b);c.lineTo(27.5,-49+b);c.lineTo(31,-44.5+b);c.fill();
  c.strokeStyle="#2a1a10";c.lineWidth=1;c.beginPath();c.moveTo(41,-33.5+b);c.lineTo(42.5,-30+b);c.moveTo(33,-39+b);c.lineTo(38,-32.5+b);c.stroke();
  
  c.strokeStyle=k.mane;c.lineWidth=2.2;
  for(let i=0;i<7;i++){const t=i/6,x=14+t*12,y=-27-t*15+b;c.beginPath();c.moveTo(x,y);c.lineTo(x-5-Math.sin(p*2+i)*1.5,y+3+Math.cos(p*2+i)*1);c.stroke()}
  
  c.fillStyle=k.hex;c.beginPath();c.roundRect(-12,-27+b,13,10,2);c.fill();
  c.fillStyle="#fff";c.font="bold 8px sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText(this.id,-5.5,-22+b);
  
  leg(c,-19,-9+b,p+Math.PI+.3,false,k.coat,7);
  leg(c,17,-9+b,p-.2,true,k.coat,5.2);
  
  const jb=b*.5;
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle="#f8fafc";c.lineWidth=3.5;c.beginPath();c.moveTo(-4,-29+jb);c.lineTo(5,-23+jb);c.lineTo(3,-15+jb);c.stroke();
  c.strokeStyle="#111";c.lineWidth=3;c.beginPath();c.moveTo(5,-23+jb);c.lineTo(4,-14+jb);c.stroke();
  
  c.fillStyle=k.hex; c.fillRect(-6,-38+jb, 14, 12); 
  c.strokeStyle=k.hex;c.lineWidth=3;c.beginPath();c.moveTo(8,-36+jb);c.lineTo(17,-34+jb);c.lineTo(24,-34+jb+Math.sin(p*2)*.5);c.stroke(); 
  c.fillStyle="#f1c9a5";c.beginPath();c.arc(12,-42+jb,2.8,0,6.283);c.fill();
  c.fillStyle=k.hex;c.beginPath();c.arc(11.5,-43+jb,3.5,3.14,6.283);c.fill();c.fillRect(8,-43.2+jb,7,1.4);
  c.fillStyle="#fbbf24";c.fillRect(13,-42+jb,2.8,1.5);
  c.strokeStyle="#fbbf24";c.lineWidth=1;c.beginPath();c.moveTo(24,-34+jb);c.quadraticCurveTo(33,-31,41.5,-30.5+b);c.stroke();
  
  c.restore();
 }
}

function createHorses(){horses=[];for(let i=0;i<numHorses;i++)horses.push(new Horse(i+1,COLORS[i%COLORS.length]))}

function resizeCanvas(){
 const c=canvas.parentElement;canvas.width=c.clientWidth;canvas.height=c.clientHeight;const layoutScale=Math.max(.62,Math.min(1,canvas.width/750));PAD_L=Math.round(125*layoutScale);PAD_R=Math.round(75*layoutScale);finishLineX=canvas.width-PAD_R;
 const topMargin = 55, bottomMargin = 15;
 const totalH = (canvas.height - topMargin - bottomMargin);
 const lh = totalH / numHorses;
 horses.forEach((h,i)=>{
  const y = topMargin + lh * i + lh/2; 
  if(!isRacing) h.reset(y); 
  else h.y = y;
 });
}
window.addEventListener('resize',resizeCanvas);

function drawTrack(){
 ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
 const topMargin = 55, bottomMargin = 15;
 const top = topMargin, bot = canvas.height - bottomMargin;
 ctx.fillStyle="#070707";ctx.fillRect(0,top,canvas.width,bot-top);
 const totalH = (bot - top), lh = totalH / numHorses;
 
 ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=1.5;ctx.setLineDash([8,8]);
 for(let i=1;i<numHorses;i++){
  const y = top + lh * i;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
 }
 ctx.setLineDash([]);
 ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(PAD_L,top);ctx.lineTo(PAD_L,bot);ctx.stroke();
 
 const picks=window.horsePickState?.()||{};
 for(const [playerId,user] of Object.entries(picks.users||{})){
  if(!user.pick)continue;
  const lane=Number(user.pick)-1;if(lane<0||lane>=numHorses)continue;
  const label=String(user.name||'플레이어');const color=picks.colors?.[playerId]||'#38bdf8';
  const badgeScale=Math.max(.62,Math.min(1,canvas.width/750)),maxBadgeWidth=Math.max(32,PAD_L-34*horseScale-8);ctx.font=`bold ${Math.max(8,11*badgeScale)}px Noto Sans KR, sans-serif`;
  let shown=label;while(shown.length>1&&ctx.measureText(shown).width>maxBadgeWidth-12)shown=shown.slice(0,-1);
  if(shown!==label)shown+='…';
  const w=Math.min(maxBadgeWidth,Math.ceil(ctx.measureText(shown).width)+12),cy=top+lh*(lane+.5);
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(4,cy-10,w,20,6);ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(shown,4+w/2,cy);
 }
 const fx=finishLineX,s=6;
 for(let y=top;y<bot;y+=s*2){
  ctx.fillStyle="#fff";ctx.fillRect(fx-s,y,s,s);ctx.fillRect(fx,y+s,s,s);
  ctx.fillStyle="#000";ctx.fillRect(fx,y,s,s);ctx.fillRect(fx-s,y+s,s,s);
 }
}

function updateLeaderboard(){
 const sorted=[...horses].sort((a,b)=>b.x-a.x);leaderboardList.innerHTML='';
 sorted.forEach((h,i)=>{
  const st=h.finished?`<span class="text-amber-400 font-extrabold">${h.rank}위 (완주)</span>`:h.status==='injured'?`<span class="text-red-400 font-bold">⚠️ 부상</span>`:h.status==='tired'?`<span class="text-blue-400 font-bold">💧 지침</span>`:`<span class="text-slate-400">${i+1}위</span>`;
  const d=document.createElement('div');d.className="flex items-center justify-between bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800 text-xs";
  d.innerHTML=`<div class="flex items-center gap-2 truncate"><span class="w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center text-slate-950" style="background:${h.col.hex}">${h.id}</span><span class="font-bold text-slate-200 truncate">${h.col.name}</span></div><div class="text-[11px] whitespace-nowrap ml-1">${st}</div>`;
  leaderboardList.appendChild(d)});
}

function showResult(){
 podiumList.innerHTML='';
 finishOrder.forEach((h,i)=>{const m=['🥇','🥈','🥉'][i]||'🎗️';const r=document.createElement('div');
  r.className=`flex items-center justify-between p-2 rounded-xl border ${i===0?'bg-amber-500/15 border-amber-500/50 text-amber-300 font-extrabold':'bg-slate-950/70 border-slate-800 text-slate-200'}`;
  r.innerHTML=`<div class="flex items-center gap-2 truncate"><span class="text-base">${m}</span><span class="w-5 h-5 rounded-full text-[11px] font-black flex items-center justify-center text-slate-950" style="background:${h.col.hex}">${h.id}</span><span class="truncate">${h.col.name}</span></div><span class="font-mono text-amber-400 font-bold">${h.finishTime.toFixed(2)}초</span>`;
  podiumList.appendChild(r)});
 resultModal.classList.remove('hidden');resultModal.classList.add('flex');
}

function startRace(sharedSeed,sharedStartAt){
 if(isRacing)return;initAudio();reqWake();
 raceSeed=Number.isFinite(Number(sharedSeed))?Number(sharedSeed):Math.floor(Math.random()*0x7fffffff);raceStartedAt=Number(sharedStartAt)||Date.now();
 isRacing=true;isFinished=false;raceLaunched=false;officiallyFinished=false;finishOrder=[];elapsedTime=Math.max(0,(Date.now()-raceStartedAt)/1000);
 horses.forEach(h=>{h.x=PAD_L;h.speed=0;h.status='normal';h.finished=false;h.rank=0;h.finishTime=0;h.phaseStart=raceRandom(raceSeed,h.id,999)*Math.PI*2;h.phase=h.phaseStart});
 startBtn.classList.add('hidden');resultModal.classList.add('hidden');resultModal.classList.remove('flex');
 liveStatusBadge.textContent="경주 진행 중";liveStatusBadge.className="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold animate-pulse";
 gameStatusText.textContent=Date.now()<raceStartedAt?"출발 준비 중입니다. 3초 후 동시에 출발합니다!":"🔥 박진감 넘치는 경주가 진행 중입니다!";
}

function resetGame(){
 relWake();isRacing=false;isFinished=false;elapsedTime=0;finishOrder=[];particles=[];
 raceTimer.textContent="⏱️ 00.00초";liveStatusBadge.textContent="대기 중";liveStatusBadge.className="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full";
 gameStatusText.textContent="🚩 [경주 스타트] 버튼을 누르면 경주가 시작됩니다!";
 startBtn.classList.remove('hidden');resultModal.classList.add('hidden');resultModal.classList.remove('flex');
 resizeCanvas();updateLeaderboard();
}

let last=performance.now();
function animate(now){
 const dt=Math.min((now-last)/1000,.08);last=now;
 if(isRacing&&!isFinished){
  const untilStart=(raceStartedAt-Date.now())/1000;elapsedTime=Math.max(0,(Date.now()-raceStartedAt)/1000);
  if(untilStart>0){
   raceTimer.textContent=`출발까지 ${untilStart.toFixed(1)}초`;
   gameStatusText.textContent=`🚨 출발 ${Math.ceil(untilStart)}초 전 — 참가자 모두 동시에 출발합니다!`;
   liveStatusBadge.textContent="3초 카운트다운";
  }else{
   raceTimer.textContent=`⏱️ ${elapsedTime.toFixed(2)}초`;
   if(!raceLaunched){raceLaunched=true;gameStatusText.textContent="🔥 경주가 시작됐습니다!";liveStatusBadge.textContent="경주 진행 중"}
  }
  if(finishOrder.length===horses.length&&!isFinished){
   isFinished=true;isRacing=false;relWake();
   liveStatusBadge.textContent=window.raceApi?.isMultiplayer?.()?"결과 동기화 중":"경기 종료";liveStatusBadge.className="text-[9px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full font-bold";
   gameStatusText.textContent=window.raceApi?.isMultiplayer?.()?"완주했습니다. 참가자 전체 결과를 집계 중입니다.":`🏆 경주 종료! 우승마: ${finishOrder[0].col.name}`;
   if(!window.raceApi?.isMultiplayer?.())playFanfare();
   window.dispatchEvent(new CustomEvent('horse-race-finished',{detail:finishOrder.map(h=>({id:h.id,time:h.finishTime}))}));
   if(!window.raceApi?.isMultiplayer?.())setTimeout(showResult,400);
  }
 }
 ctx.clearRect(0,0,canvas.width,canvas.height);drawTrack();drawParticles(dt);
 [...horses].sort((a,b)=>a.y-b.y).forEach(h=>{h.update(dt,canvas.width);h.draw(ctx)});
 if(isRacing||particles.length)updateLeaderboard();
 requestAnimationFrame(animate);
}

window.raceApi={
 start:startRace,
 isMultiplayer:()=>Boolean(window.__horseRoomActive),
 completeOfficially:results=>{
  if(!Array.isArray(results)||!results.length)return;
  finishOrder=results.map((r,i)=>horses.find(h=>h.id===Number(r.horse))).filter(Boolean);
  finishOrder.sort((a,b)=>results.findIndex(r=>Number(r.horse)===a.id)-results.findIndex(r=>Number(r.horse)===b.id));
  finishOrder.forEach((h,i)=>{h.rank=i+1;h.finishTime=Number(results[i]?.time)||h.finishTime;h.x=finishLineX;h.finished=true;h.status='normal'});
  isRacing=false;isFinished=true;raceLaunched=true;relWake();
  raceTimer.textContent=`⏱️ ${Math.max(...finishOrder.map(h=>h.finishTime)).toFixed(2)}초`;
  liveStatusBadge.textContent='경기 종료';
  gameStatusText.textContent='참가자 전체 경기가 종료됐습니다.';
  if(!officiallyFinished){officiallyFinished=true;playFanfare()}
  updateLeaderboard();
 },
 getHorseCount:()=>numHorses,
 setHorseCount:n=>{numHorses=n;horseCountSelect.value=String(n);createHorses();resetGame()}
};

startBtn.addEventListener('click',startRace);
$('resetBtn').addEventListener('click',resetGame);$('modalRestartBtn').addEventListener('click',resetGame);
horseCountSelect.addEventListener('change',e=>{numHorses=parseInt(e.target.value,10);createHorses();resetGame()});
horseScaleRange.addEventListener('input',e=>{const v=parseInt(e.target.value,10);horseScale=v/100;$('horseScaleVal').textContent=v+'%'});
window.addEventListener('load',()=>{createHorses();resizeCanvas();updateLeaderboard();requestAnimationFrame(animate)});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, deleteField, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const appId=typeof __app_id!=='undefined'?__app_id:'penalty-shootout-app';
const firebaseConfig=typeof __firebase_config!=="undefined"?JSON.parse(__firebase_config):{apiKey:"AIzaSyCl8PfDXVj1qLVt1TcxqHt_qymqY7X43zAI",authDomain:"stock-game-768.firebaseapp.com",projectId:"stock-game-768",storageBucket:"stock-game-768.firebasestorage.app",messagingSenderId:"89845431802",appId:"1:89845431802:web:517763d2ba33bf4432b843"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const roomRef=id=>doc(db,'artifacts',appId,'public','data','horse_rooms',id);

const msg=$('mpMessage'),roomBox=$('mpRoom');let uid='',room='',roomData=null,unsubscribe=null,isHost=false,lastPhase='',playerColors=new Map();
window.__horseRoomActive=false;
window.horsePickState=()=>({users:roomData?.users||{},colors:Object.fromEntries(playerColors)});

const buttonStyle='padding:7px 10px;border:1px solid #64748b;border-radius:8px;background:#1e293b;color:#f8fafc;font-weight:bold;cursor:pointer';
document.querySelectorAll('#multiPanel button').forEach(b=>b.style.cssText=buttonStyle);

async function initAuth(){
 try{
  let cred;
  if(typeof __initial_auth_token!=="undefined"&&__initial_auth_token)cred=await signInWithCustomToken(auth,__initial_auth_token);
  else cred=await signInAnonymously(auth);
  uid=cred.user.uid;
  msg.textContent='온라인 · 닉네임을 입력해 방을 만들거나 참가하세요.';
 }catch(e){
  console.error('Firebase auth init error',e);
  msg.textContent=`Firebase 로그인 오류 (${e.code||'unknown'}): ${e.message}`;
 }
}
initAuth();

function cleanName(){return $('mpName').value.trim().slice(0,16)||'게스트'}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}

async function connect(codeValue, create=false){
 if(!uid) throw Error('로그인 중입니다. 1~2초 후 다시 시도하세요.');
 room = codeValue.trim().toUpperCase();
 if(!room) throw Error('방 코드를 입력해주세요.');
 const rr = roomRef(room);

 if(create){
  const checkSnap = await getDoc(rr);
  if(checkSnap.exists()) throw Error('이미 존재하는 방 코드입니다. 다시 시도하세요.');
  await setDoc(rr, {
   name: $('mpRoomName').value.trim().slice(0,24) || `${cleanName()}의 경마방`,
   host: uid,
   horseCount: Number($('mpHorseCount').value),
   phase: 'lobby',
   createdAt: Date.now(),
   users: {}
  });
 }

 const snap = await getDoc(rr);
 if(!snap.exists()) throw Error(`방 코드 [${room}]을 찾을 수 없습니다.`);
 
 const data = snap.data();
 if(!create && data.phase !== 'lobby' && !data.users?.[uid]){
  throw Error('이미 경기가 시작된 방입니다.');
 }

 isHost = create || data.host === uid;
 window.__horseRoomActive = true;

 // 💡 updateDoc 대신 setDoc merge를 사용하여 신규 참가 오류 수정
 await setDoc(rr, {
  users: {
   [uid]: {
    name: cleanName(),
    pick: null,
    skip: false,
    joinedAt: Date.now()
   }
  }
 }, { merge: true });

 $('mpRoomCode').textContent = room;
 $('mpRoomNameDisplay').textContent = data.name || '경마방';
 $('mpHorseSetting').hidden = !isHost;
 roomBox.hidden = false;

 unsubscribe?.();
 unsubscribe = onSnapshot(rr, s => {
  roomData = s.exists() ? s.data() : null;
  if(!roomData){
   msg.textContent = '방장이 방을 종료했습니다.';
   roomBox.hidden = true;
   return;
  }
  render();
 }, e => {
  console.error('onSnapshot Error:', e);
  msg.textContent = '방 동기화 오류: ' + e.message;
 });
 msg.textContent = '';
}

// 모든 참가자의 선택이 끝나면 3초 카운트다운 출발 트리거
async function checkAndAutoStart(){
 if(!roomData||roomData.phase!=='lobby')return;
 const users=roomData.users||{}, players=Object.values(users);
 if(players.length===0)return;
 
 const allDone=players.every(u=>u.skip||u.pick);
 if(allDone){
  try{
   await runTransaction(db, async tx=>{
    const snap=await tx.get(roomRef(room));
    if(!snap.exists())return;
    const data=snap.data();
    if(data.phase==='lobby'){
     tx.update(roomRef(room),{
      phase:'countdown',
      startedAt:Date.now()+3000,
      raceSeed:Math.floor(Math.random()*0x7fffffff),
      results:null
     });
    }
   });
  }catch(e){
   console.error('자동 시작 트랜잭션 실패:', e);
  }
 }
}

function render(){
 if(!roomData)return;
 const users=roomData.users||{},players=Object.entries(users);
 playerColors=new Map();
 [...players].sort(([a],[b])=>a.localeCompare(b)).forEach(([id],i)=>playerColors.set(id,`hsl(${Math.round((i*137.508)%360)} 78% 48%)`));
 
 $('mpCount').textContent=players.length;
 $('mpPhase').textContent=({lobby:'말 선택 중',countdown:'출발 준비 중',racing:'경기 진행 중',finished:'경기 종료'})[roomData.phase]||'대기 중';
 $('mpHorseCount').value=roomData.horseCount||5;
 
 if(window.raceApi&&window.raceApi.getHorseCount()!==(Number(roomData.horseCount)||5)) {
  window.raceApi.setHorseCount(Number(roomData.horseCount)||5);
 }
 
 $('startBtn').classList.toggle('hidden',Boolean(room));
 
 if(roomData.phase==='countdown'&&lastPhase!=='countdown'){
  window.raceApi?.start(roomData.raceSeed,roomData.startedAt);
 }
 if(roomData.phase==='finished'){
  window.raceApi?.completeOfficially(roomData.results);
 }
 lastPhase=roomData.phase;
 
 $('mpPlayers').innerHTML=players.map(([id,u])=>`<span style="display:inline-flex;align-items:center;gap:5px;background:#1e293b;border:1px solid ${playerColors.get(id)};border-radius:8px;padding:5px 8px;margin:2px"><span style="width:9px;height:9px;border-radius:50%;background:${playerColors.get(id)}"></span>${esc(u.name)}${id===roomData.host?' 👑':''} · ${u.skip?'건너뜀':u.pick?u.pick+'번 말':roomData.phase==='lobby'?'말 선택 대기':'미선택'}</span>`).join('');
 
 $('mpSkip').disabled=roomData.phase!=='lobby';$('mpPickHint').textContent=roomData.phase==='lobby'?'트랙에서 원하는 말을 누르세요. 이미 선택된 말은 고를 수 없습니다.':'선택이 마감되었습니다.';
 $('mpPickRow').style.opacity=roomData.phase==='lobby'?'1':'.6';$('mpResults').textContent='';
 
 if(roomData.phase==='finished'&&roomData.results){
  const order=roomData.results,byHorse=new Map(order.map((r,i)=>[Number(r.horse),i+1]));
  const ranked=players.filter(([,u])=>u.pick&&byHorse.has(Number(u.pick))).map(([id,u])=>({id,name:u.name,pick:Number(u.pick),horseRank:byHorse.get(Number(u.pick))})).sort((a,b)=>a.horseRank-b.horseRank);
  const rows=ranked.length?ranked.map((u,i)=>`<div class="rounded-lg ${i===0?'bg-amber-500/15 border-amber-500/50 text-amber-200 font-extrabold':'bg-slate-950/70 border-slate-800 text-slate-200'} border p-2">${i===0?'🏆 ':''}${i+1}위 ${esc(u.name)} (${u.pick}번 말 - ${u.horseRank}위)</div>`).join(''):'<div class="text-slate-300">승리한 유저가 없습니다.</div>';
  const markup=`<div class="text-center text-amber-300 font-bold mb-2">유저 최종 순위</div><div class="space-y-1">${rows}</div>`;
  $('mpResults').innerHTML=markup;
  $('podiumList').innerHTML=markup;
  const title=document.querySelector('#resultModal h2');
  if(title)title.textContent='유저 최종 순위';
  $('resultModal').classList.remove('hidden');$('resultModal').classList.add('flex');
 }

 checkAndAutoStart();
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
$('mpCreate').onclick=async()=>{try{const c=code();await connect(c,true)}catch(e){msg.textContent=e.message}};
$('mpJoin').onclick=async()=>{try{await connect($('mpCode').value.trim().toUpperCase(),false)}catch(e){msg.textContent=e.message}};

async function chooseHorse(horse){
 if(!uid||!room||roomData?.phase!=='lobby')return;
 const rr=roomRef(room),playerId=uid;
 try{
  await runTransaction(db,async tx=>{
   const snap=await tx.get(rr);
   if(!snap.exists())throw Error('방이 종료되었습니다.');
   const data=snap.data(),users=data.users||{};
   if(data.phase!=='lobby')throw Error('선택 시간이 끝났습니다.');
   const owner=Object.entries(users).find(([id,u])=>id!==playerId&&Number(u.pick)===horse);
   if(owner)throw Error(`${owner[1].name||'다른 유저'}님이 이미 선택한 말입니다.`);
   if(!users[playerId])throw Error('방 참가 상태를 확인할 수 없습니다.');
   tx.update(rr,{['users.'+playerId+'.pick']:horse,['users.'+playerId+'.skip']:false});
  });
  msg.textContent=`${horse}번 말을 선택했습니다.`;
 }catch(e){msg.textContent=e.message}
}

canvas.addEventListener('click',e=>{
 if(!room||roomData?.phase!=='lobby')return;
 const rect=canvas.getBoundingClientRect(),y=(e.clientY-rect.top)*(canvas.height/rect.height),top=55,bottom=canvas.height-15;
 if(y<top||y>=bottom)return;
 const lane=Math.floor((y-top)/((bottom-top)/numHorses));
 if(lane>=0&&lane<numHorses)chooseHorse(lane+1)
});
canvas.style.cursor='pointer';

$('mpSkip').onclick=async()=>{
 if(!uid||!room)return;
 const rr=roomRef(room),playerId=uid;
 try{
  await runTransaction(db,async tx=>{
   const snap=await tx.get(rr);
   if(!snap.exists()||snap.data().phase!=='lobby')throw Error('선택 시간이 끝났습니다.');
   tx.update(rr,{['users.'+playerId+'.pick']:null,['users.'+playerId+'.skip']:true})
  });
  msg.textContent='이번 경기를 건너뜁니다.';
 }catch(e){msg.textContent=e.message}
};

$('mpHorseCount').onchange=()=>isHost&&roomData?.phase==='lobby'&&updateDoc(roomRef(room),{horseCount:Number($('mpHorseCount').value)});

$('mpLeave').onclick=async()=>{
 if(room&&uid){
  if(isHost)await deleteDoc(roomRef(room));
  else await updateDoc(roomRef(room),{['users.'+uid]:deleteField()})
 }
 unsubscribe?.();
 unsubscribe=null;
 room='';roomData=null;
 window.__horseRoomActive=false;
 roomBox.hidden=true;
 msg.textContent='방에서 나왔습니다.'
};

window.addEventListener('horse-race-finished',async e=>{
 if(isHost&&room&&roomData?.phase==='countdown'){
  const results=e.detail.map(x=>({horse:x.id,time:x.time}));
  await updateDoc(roomRef(room),{phase:'finished',results,finishedAt:Date.now()});
 }
});
</script>
