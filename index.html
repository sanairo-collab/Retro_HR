body{font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow-x:hidden;overflow-y:auto;background:#030712;box-sizing:border-box}

  0% { transform: scale(0.6); opacity: 0; }
  50% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.count-pop { animation: countPop 0.35s ease-out forwards; }

<body class="bg-slate-950 text-slate-100 min-h-screen w-screen flex flex-col justify-between p-1 sm:p-2">
<header class="w-full bg-slate-900/95 border-b border-amber-500/40 px-2 sm:px-3 py-1 rounded-xl flex items-center justify-between gap-1.5 text-xs shrink-0 shadow-lg">
 <div class="flex items-center gap-1 shrink-0"><span class="text-base sm:text-lg">🏇</span><h1 class="font-black text-amber-400 font-jua text-xs sm:text-sm whitespace-nowrap">리얼 그랑프리</h1></div>
 <div class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto no-scrollbar">
  <button id="soundToggleBtn" class="flex items-center bg-slate-800 text-amber-400 font-bold px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 text-[10px] sm:text-[11px] gap-1 whitespace-nowrap"><span id="soundIcon">🔊</span><span id="soundText" class="hidden sm:inline">사운드 ON</span></button>
  <div id="singleHorseSetting" class="flex items-center bg-slate-800/90 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 text-[10px] sm:text-[11px]"><label class="text-slate-300 font-bold mr-1 whitespace-nowrap">말:</label>

    <option value="2">2두</option><option value="3">3두</option><option value="4">4두</option><option value="5" selected>5두</option><option value="6">6두</option><option value="7">7두</option><option value="8">8두</option><option value="9">9두</option><option value="10">10두</option></select></div>
  <div class="flex items-center bg-slate-800/90 px-1.5 sm:px-2 py-0.5 rounded-lg border border-slate-700 text-[10px] sm:text-[11px] gap-1"><label class="text-slate-300 font-bold whitespace-nowrap">크기:</label>

<section id="multiPanel" class="bg-slate-900 text-slate-100 border border-slate-700 rounded-xl p-2 sm:p-2.5 my-1 text-xs shrink-0 shadow">
 <!-- 방 입장 전 설정 바 -->
 <div id="mpLobbySetup" class="flex flex-wrap gap-1.5 items-center">
  <b class="text-amber-400 text-xs sm:text-sm font-black whitespace-nowrap">멀티 경마</b>
  <input id="mpName" maxlength="16" placeholder="닉네임" class="w-20 sm:w-24 px-2 py-1 bg-slate-950 text-white border border-slate-700 rounded-lg text-xs">
  <input id="mpRoomName" maxlength="24" placeholder="방 이름" class="w-24 sm:w-28 px-2 py-1 bg-slate-950 text-white border border-slate-700 rounded-lg text-xs">
  <button id="mpCreate" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded-lg text-xs whitespace-nowrap">방 만들기</button>
  <input id="mpCode" maxlength="6" placeholder="방 코드" class="w-16 sm:w-20 px-2 py-1 uppercase bg-slate-950 text-white border border-slate-700 rounded-lg text-xs">
  <button id="mpJoin" class="bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold px-2.5 py-1 rounded-lg border border-slate-600 text-xs whitespace-nowrap">참가</button>
  <span id="mpMessage" class="text-slate-400 text-[11px] truncate flex-1 min-w-[120px]"></span>
 </div>
 
 <!-- 방 입장 후 컴팩트 룸 바 (상단 공간 최소화) -->
 <div id="mpRoom" hidden class="space-y-1.5">

   <button id="mpLeave" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 font-bold px-2 py-0.5 rounded border border-rose-800/80 text-[10px] sm:text-[11px] whitespace-nowrap shrink-0">🚪 방 나가기</button>
  </div>

    <label id="mpHorseSetting" hidden class="flex items-center bg-slate-950 px-1.5 py-0.5 rounded border border-slate-700 text-[10px] sm:text-[11px] gap-1">말 수 <select id="mpHorseCount" class="bg-slate-900 text-amber-400 font-bold rounded px-1"><option>2</option><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
    <button id="mpHostStartBtn" hidden class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black px-2.5 py-0.5 rounded border border-amber-300 text-[11px] sm:text-xs shadow whitespace-nowrap">🚩 경주 시작!</button>

<main class="flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-1.5 my-0.5 min-h-0">
 <div class="lg:col-span-3 bg-slate-900 rounded-xl p-1 border border-slate-800/80 flex flex-col justify-between relative overflow-hidden h-[280px] sm:h-[350px] lg:h-[calc(100vh-80px)] min-h-[260px]">

     <div id="countdownNumber" class="text-7xl sm:text-9xl font-black font-jua text-amber-400 drop-shadow-[0_0_35px_rgba(245,158,11,0.95)] count-pop">3</div>
     <div id="countdownSub" class="text-xs sm:text-sm font-extrabold text-amber-200 bg-slate-900/90 px-3.5 py-1 rounded-full border border-amber-500/50 mt-2 shadow-2xl backdrop-blur-sm">잠시 후 출발합니다!</div>
    </div>
   </div>

   <!-- 최종 결과 및 시상식 모달 -->
   <div id="resultModal" class="absolute inset-0 bg-slate-950/85 hidden items-center justify-center p-2 z-40">
    <div class="bg-slate-900 border-2 border-amber-500/80 rounded-2xl p-3 max-w-xs sm:max-w-sm w-full text-center max-h-[95%] flex flex-col min-h-0 shadow-2xl">
     <div class="text-xl">🏆</div><h2 class="text-sm sm:text-base font-black text-amber-400 font-jua">시상식 및 최종 순위</h2>
     <div id="podiumList" class="space-y-1 my-1.5 text-left text-[11px] sm:text-xs overflow-y-auto min-h-0 flex-1"></div>
     <button id="modalRestartBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black py-1.5 rounded-xl font-jua text-xs border border-amber-300">🔄 한 게임 더 하기!</button>
    </div>
   </div>
  </div>
  
  <div class="mt-1 bg-slate-950/95 px-2.5 py-0.5 rounded-lg border border-slate-800 flex items-center justify-between text-[11px] shrink-0">
   <div id="gameStatusText" class="font-jua text-amber-300 truncate">🚩 말을 선택하거나 [경주 스타트] 버튼을 누르면 시작됩니다!</div>
   <div id="raceTimer" class="font-mono text-amber-400 font-extrabold whitespace-nowrap ml-2 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">⏱️ 00.00초</div>
  </div>
 </div>
 
 <div class="hidden sm:flex lg:col-span-1 bg-slate-900 rounded-xl p-2 border border-slate-800/80 flex-col min-h-0 overflow-hidden h-[280px] lg:h-[calc(100vh-80px)]">
  <h2 class="text-xs font-extrabold text-amber-400 font-jua border-b border-slate-800 pb-1 mb-1.5 flex items-center justify-between shrink-0"><span>📊 실시간 라이브 순위</span><span id="liveStatusBadge" class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded-full">대기 중</span></h2>
  <div id="leaderboardList" class="flex-1 space-y-1 overflow-y-auto min-h-0"></div>
 </div>
</main>

<script>
const COLORS=[
{name:"레드 썬더",hex:"#ef4444",coat:"#a0522d",dark:"#70391e",mane:"#3e1f10",blaze:1},
{name:"블루 스톰",hex:"#3b82f6",coat:"#cd853f",dark:"#9a632f",mane:"#5c3a1c",blaze:0},
{name:"골든 차크라",hex:"#f59e0b",coat:"#d4a373",dark:"#a0784d",mane:"#604020",blaze:1},
{name:"에메랄드 윈드",hex:"#10b981",coat:"#bc8f8f",dark:"#8b6969",mane:"#5c4646",blaze:0},
{name:"퍼플 갤럭시",hex:"#a855f7",coat:"#deb887",dark:"#b89768",mane:"#fff8dc",blaze:1},
{name:"오렌지 블레이즈",hex:"#f97316",coat:"#cd5c5c",dark:"#8b3a3a",mane:"#5c2626",blaze:0},
{name:"핑크 메테오",hex:"#ec4899",coat:"#f4a460",dark:"#b8733d",mane:"#5c3a1c",blaze:1},
{name:"시안 라이트닝",hex:"#06b6d4",coat:"#d2b48c",dark:"#a0784d",mane:"#5c3a1c",blaze:0},
{name:"라임 스프린트",hex:"#84cc16",coat:"#c19a6b",dark:"#8b6941",mane:"#4a3520",blaze:1},
{name:"크림슨 발키리",hex:"#e11d48",coat:"#d2691e",dark:"#a55217",mane:"#6b360f",blaze:0}];

const $=id=>document.getElementById(id);
const canvas=$('raceCanvas'),ctx=canvas.getContext('2d');
const horseCountSelect=$('horseCountSelect'),horseScaleRange=$('horseScaleRange'),startBtn=$('startBtn'),leaderboardList=$('leaderboardList'),gameStatusText=$('gameStatusText'),raceTimer=$('raceTimer'),liveStatusBadge=$('liveStatusBadge'),resultModal=$('resultModal'),podiumList=$('podiumList');
const countdownOverlay=$('countdownOverlay'),countdownNumber=$('countdownNumber'),countdownSub=$('countdownSub');

let soundEnabled=true,audioCtx=null;
function initAudio(){if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(A)audioCtx=new A()}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}
function playHoof(){if(!soundEnabled||!audioCtx)return;try{const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(80+Math.random()*40,t);o.frequency.exponentialRampToValueAtTime(20,t+.05);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(t+.05)}catch(e){}}
function playBeep(freq=440,dur=0.08){if(!soundEnabled||!audioCtx)return;try{const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur)}catch(e){}}
function playFanfare(){if(!soundEnabled||!audioCtx)return;try{[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),s=audioCtx.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+.35);o.connect(g);g.connect(audioCtx.destination);o.start(s);o.stop(s+.35)})}catch(e){}}
$('soundToggleBtn').addEventListener('click',()=>{soundEnabled=!soundEnabled;$('soundIcon').textContent=soundEnabled?'🔊':'🔇';$('soundText').textContent=soundEnabled?'사운드 ON':'사운드 OFF';if(soundEnabled)initAudio()});

let wakeLock=null;
async function reqWake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function relWake(){if(wakeLock){wakeLock.release().then(()=>wakeLock=null).catch(()=>{})}}

// 시간 동기화 함수 (전역 공유)
window.__serverTimeOffset = 0;
window.getSyncedTime = () => Date.now() + (window.__serverTimeOffset || 0);

let numHorses=5,horseScale=.85,horses=[],particles=[],isRacing=false,isFinished=false,raceStartedAt=0,raceSeed=1,elapsedTime=0,finishOrder=[],raceLaunched=false,officiallyFinished=false;
let precomputedResults=null,maxFinishTime=0,beepFlags={};
let PAD_L=125,PAD_R=75;let finishLineX=0;

function dust(x,y,color='#64748b',n=1){
 if(particles.length>14)return;
 for(let i=0;i<n;i++) particles.push({x:x+(Math.random()-.5)*4, y:y+(Math.random()-.5)*2, vx:-0.3-Math.random()*0.5, vy:-0.1-Math.random()*0.2, r:0.8+Math.random()*1.0, a:0.35+Math.random()*0.2, c:color});
}
function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.a-=dt*1.5;p.r+=dt*1.5;if(p.a<=0){particles.splice(i,1);continue}ctx.save();ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();ctx.restore()}}

function leg(c,hx,hy,p,front,col,w){
 const sw=Math.sin(p),lift=Math.max(0,Math.cos(p));
 const a1=sw*(front?.8:.7);
 const a2=front?a1-.15-lift*1.25:a1+.35-lift*.9;
 const L1=front?11:8,L2=front?11:9.5;
 const kx=hx+Math.sin(a1)*L1,ky=hy+Math.cos(a1)*L1;
 const a3=front?a2+.25*lift:a2-.45;
 const fx=kx+Math.sin(a2)*L2,fy=ky+Math.cos(a2)*L2;
 const hfx=fx+Math.sin(a3)*3.5,hfy=fy+Math.cos(a3)*3.5;
 c.lineCap='round';c.lineJoin='round';c.strokeStyle=col;
 c.lineWidth=w;c.beginPath();c.moveTo(hx,hy);c.lineTo(kx,ky);c.stroke();
 c.lineWidth=w*.62;c.beginPath();c.moveTo(kx,ky);c.lineTo(fx,fy);c.stroke();
 c.lineWidth=w*.5;c.strokeStyle="#161010";c.beginPath();c.moveTo(fx,fy);c.lineTo(hfx,hfy);c.stroke();
}

function raceRandom(seed,horseId,slot){
 let x=(Number(seed)^Math.imul(horseId,0x9e3779b1)^Math.imul(slot+1,0x85ebca6b))>>>0;
 x=Math.imul(x^(x>>>16),0x7feb352d);x=Math.imul(x^(x>>>15),0x846ca68b);x^=x>>>16;
 return (x>>>0)/4294967296;
}
function raceStatusAt(horseId,t,seed=raceSeed){
 let status='normal';const sec=Math.floor(t);
 for(let s=Math.max(0,sec-1);s<=sec;s++)if(raceRandom(seed,horseId,10000+s*2)<.075&&t<s+2)status=raceRandom(seed,horseId,10001+s*2)<.5?'injured':'tired';
 return status;
}
function raceProgress(horseId,t,seed=raceSeed){
 const target=600,step=.2,scale=60;let distance=0,finishAt=null;
 const count=Math.ceil(Math.max(0,t)/step);
 for(let i=0;i<count&&distance<target;i++){
  const from=i*step,duration=Math.min(step,t-from),mid=from+duration/2,status=raceStatusAt(horseId,mid,seed);
  const velocity=(.35+raceRandom(seed,horseId,i)*.2)*scale*(status==='injured'?0:status==='tired'?.4:1);
  if(velocity>0&&distance+velocity*duration>=target){finishAt=from+(target-distance)/velocity;distance=target;break}
  distance+=velocity*duration;
 }
 return {distance:distance/target,status:raceStatusAt(horseId,t,seed),finishAt};
}

function calcHorseFinishTime(seed,horseId){
 const target=600,step=.2,scale=60;let distance=0;
 for(let i=0;i<1500;i++){
  const from=i*step,duration=step,mid=from+duration/2;
  const status=raceStatusAt(horseId,mid,seed);
  const velocity=(.35+raceRandom(seed,horseId,i)*.2)*scale*(status==='injured'?0:status==='tired'?.4:1);
  if(velocity>0&&distance+velocity*duration>=target){return from+(target-distance)/velocity}
  distance+=velocity*duration;
 }
 return 30.0;
}
function precomputeRace(seed,count){
 const list=[];
 for(let id=1;id<=count;id++){
  list.push({horse:id,time:calcHorseFinishTime(seed,id)});
 }
 list.sort((a,b)=>a.time-b.time||a.horse-b.horse);
 return list.map((item,idx)=>({...item,rank:idx+1}));
}
window.precomputeRace=precomputeRace;

class Horse{
 constructor(id,col){this.id=id;this.col=col;this.reset(0)}
 reset(y){
  this.x=PAD_L;this.y=y;this.speed=0;
  this.baseSpeed=0.42;
  this.phase=Math.random()*6.28;this.phaseStart=this.phase;this.status='normal';this.timer=0;this.rank=0;this.finished=false;this.finishTime=0;this.chg=Math.random()*40
 }
 update(dt,tw){
  if(!isRacing)return;
  const progress=raceProgress(this.id,elapsedTime,raceSeed);
  this.status=progress.status;
  
  if(!this.finished){
   this.x=PAD_L+progress.distance*(finishLineX-PAD_L);
   this.speed=(.35+raceRandom(raceSeed,this.id,Math.floor(elapsedTime/.2))*.2)*(tw/750)*(this.status==='injured'?0:this.status==='tired'?.4:1);
   this.phase=this.phaseStart+elapsedTime*55;
   if(progress.finishAt!==null&&elapsedTime>=progress.finishAt){
    this.finished=true;this.x=finishLineX;this.finishTime=progress.finishAt;
    if(!finishOrder.some(h=>h.id===this.id)) finishOrder.push(this);
    finishOrder.sort((a,b)=>a.finishTime-b.finishTime||a.id-b.id);
    finishOrder.forEach((h,i)=>h.rank=i+1);
    dust(this.x,this.y,'#f59e0b',7);
   }
  }else{
   this.x=finishLineX;
  }
 }
 draw(c){
  const k=this.col,p=this.phase,moving=this.speed>0&&this.status!=='injured'&&!this.finished;
  const bob=moving?Math.sin(p*2)*.4:0;
  
  c.save();c.translate(this.x,this.y);c.scale(horseScale,horseScale);
  
  if(this.status==='injured'){
   c.rotate(.05);
   c.fillStyle="#ef4444";c.font="bold 28px sans-serif";c.textAlign="center";c.fillText("⚠️",0,-46+bob);
  } else if(this.status==='tired'){

function createHorses(){horses=[];for(let i=0;i<numHorses;i++)horses.push(new Horse(i+1,COLORS[i%COLORS.length]))}

function resizeCanvas(){
 const c=canvas.parentElement;canvas.width=c.clientWidth;canvas.height=c.clientHeight;const layoutScale=Math.max(.62,Math.min(1,canvas.width/750));PAD_L=Math.round(125*layoutScale);PAD_R=Math.round(75*layoutScale);finishLineX=canvas.width-PAD_R;
 const topMargin = 55, bottomMargin = 15;
 const totalH = (canvas.height - topMargin - bottomMargin);
 const lh = totalH / numHorses;
 horses.forEach((h,i)=>{
  const y = topMargin + lh * i + lh/2; 
  if(!isRacing) h.reset(y); 
  else h.y = y;
 });
}

function drawTrack(){

 const top = topMargin, bot = canvas.height - bottomMargin;
 ctx.fillStyle="#070707";ctx.fillRect(0,top,canvas.width,bot-top);
 const totalH = (bot - top), lh = totalH / numHorses;
 
 ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=1.5;ctx.setLineDash([8,8]);
 for(let i=1;i<numHorses;i++){
  const y = top + lh * i;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
 }
 ctx.setLineDash([]);
 ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(PAD_L,top);ctx.lineTo(PAD_L,bot);ctx.stroke();
 
 const picks=window.horsePickState?.()||{};
 for(const [playerId,user] of Object.entries(picks.users||{})){
  if(!user.pick)continue;
  const lane=Number(user.pick)-1;if(lane<0||lane>=numHorses)continue;
  const label=String(user.name||'플레이어');const color=picks.colors?.[playerId]||'#38bdf8';
  const badgeScale=Math.max(.62,Math.min(1,canvas.width/750)),maxBadgeWidth=Math.max(32,PAD_L-34*horseScale-8);ctx.font=`bold ${Math.max(8,11*badgeScale)}px Noto Sans KR, sans-serif`;
  let shown=label;while(shown.length>1&&ctx.measureText(shown).width>maxBadgeWidth-12)shown=shown.slice(0,-1);
  if(shown!==label)shown+='…';
  const w=Math.min(maxBadgeWidth,Math.ceil(ctx.measureText(shown).width)+12),cy=top+lh*(lane+.5);
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(4,cy-10,w,20,6);ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(shown,4+w/2,cy);

  ctx.fillStyle="#fff";ctx.fillRect(fx-s,y,s,s);ctx.fillRect(fx,y+s,s,s);
  ctx.fillStyle="#000";ctx.fillRect(fx,y,s,s);ctx.fillRect(fx-s,y+s,s,s);

 precomputedResults=sharedResults||precomputeRace(raceSeed,numHorses);
 maxFinishTime=Math.max(...precomputedResults.map(r=>r.time));
 
 isRacing=true;isFinished=false;raceLaunched=false;officiallyFinished=false;finishOrder=[];beepFlags={};

 horses.forEach(h=>{

 });

let last=performance.now();
function animate(now){
 const dt=Math.min((now-last)/1000,.08);last=now;
 if(isRacing&&!isFinished){
  const currentSynced=window.getSyncedTime();
  const untilStart=(raceStartedAt-currentSynced)/1000;
  
  if(untilStart>0){
   elapsedTime=0;
   raceTimer.textContent=`출발까지 ${untilStart.toFixed(1)}초`;
   const sCeil=Math.ceil(untilStart);
   gameStatusText.textContent=`🚨 출발 ${sCeil}초 전 — 모든 화면에서 동시에 출발합니다!`;
   liveStatusBadge.textContent=`카운트 ${sCeil}`;
   
   // 🚨 대형 중앙 3초 카운트다운 표시
   countdownOverlay.classList.remove('hidden');
   if(countdownNumber.textContent!==String(sCeil)){
    countdownNumber.textContent=String(sCeil);
    countdownNumber.classList.remove('count-pop');
    void countdownNumber.offsetWidth; // CSS 리플로우 트리거
    countdownNumber.classList.add('count-pop');
   }
   
   if([3,2,1].includes(sCeil)&&!beepFlags[sCeil]){
    beepFlags[sCeil]=true;playBeep(440,0.1);
   }
  }else{
   elapsedTime=Math.max(0,(currentSynced-raceStartedAt)/1000);
   raceTimer.textContent=`⏱️ ${elapsedTime.toFixed(2)}초`;
   
   if(!raceLaunched){
    raceLaunched=true;beepFlags[0]=true;playBeep(880,0.28);
    
    // START! 표시 후 부드럽게 퇴장
    countdownNumber.textContent="START!";
    countdownNumber.className="text-6xl sm:text-8xl font-black font-jua text-emerald-400 drop-shadow-[0_0_35px_rgba(52,211,153,0.95)] count-pop";
    countdownSub.textContent="🔥 경주가 시작되었습니다!";
    setTimeout(()=>{ countdownOverlay.classList.add('hidden'); }, 700);
    
    gameStatusText.textContent="🔥 모든 참가자의 경주가 시작됐습니다!";
    liveStatusBadge.textContent="경주 진행 중";
    liveStatusBadge.className="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold animate-pulse";
   }
   
   // 모든 말이 결승선을 통과했거나 최대 완주 시간에 도달한 경우
   const allDoneByTime = maxFinishTime > 0 && elapsedTime >= (maxFinishTime + 0.1);
   if((finishOrder.length===horses.length || allDoneByTime) && !isFinished){
    isFinished=true;isRacing=false;relWake();
    countdownOverlay.classList.add('hidden');
    
    if(finishOrder.length<horses.length&&precomputedResults){
     precomputedResults.forEach(pr=>{
      const h=horses.find(x=>x.id===pr.horse);
      if(h&&!h.finished){
       h.finished=true;h.x=finishLineX;h.finishTime=pr.time;h.rank=pr.rank;
       if(!finishOrder.some(x=>x.id===h.id)) finishOrder.push(h);
      }
     });
     finishOrder.sort((a,b)=>a.finishTime-b.finishTime||a.id-b.id);
    }
    liveStatusBadge.textContent="경기 종료";
    liveStatusBadge.className="text-[9px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full font-bold";

function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}

async function connect(codeValue, create=false){
 if(!uid) throw Error('로그인 중입니다. 1~2초 후 다시 시도하세요.');
 room = codeValue.trim().toUpperCase();
 if(!room) throw Error('방 코드를 입력해주세요.');
 const rr = roomRef(room);

 if(create){
  const checkSnap = await getDoc(rr);
  if(checkSnap.exists()) throw Error('이미 존재하는 방 코드입니다. 다시 시도하세요.');
  await setDoc(rr, {
   name: $('mpRoomName').value.trim().slice(0,24) || `${cleanName()}의 경마방`,
   host: uid,
   horseCount: Number($('mpHorseCount').value) || 5,
   phase: 'lobby',
   createdAt: Date.now(),
   users: {}
  });
 }

 const snap = await getDoc(rr);
 if(!snap.exists()) throw Error(`방 코드 [${room}]을 찾을 수 없습니다.`);
 
 const data = snap.data();
 if(!create && data.phase !== 'lobby' && !data.users?.[uid]){
  throw Error('이미 경기가 시작된 방입니다.');
 }

 isHost = create || data.host === uid;
 window.__horseRoomActive = true;

 await syncServerTime();

 await setDoc(rr, {
  users: {
   [uid]: {
    name: cleanName(),
    pick: null,
    skip: false,
    joinedAt: Date.now()
   }
  }
 }, { merge: true });

 $('mpRoomCode').textContent = room;
 $('mpRoomNameDisplay').textContent = data.name || '경마방';
 
 // 🚀 [요구사항 3] 방 입장 후 상단 텍스트 박스/버튼 숨김 처리 (모바일 뷰 최적화)
 setupBox.style.display = 'none';
 $('singleHorseSetting').classList.add('hidden'); // 헤더 말수 선택 숨김
 $('startBtn').classList.add('hidden'); // 싱글 스타트 버튼 숨김
 roomBox.hidden = false;

 unsubscribe?.();
 unsubscribe = onSnapshot(rr, s => {
  roomData = s.exists() ? s.data() : null;
  if(!roomData){
   msg.textContent = '방이 종료되었습니다.';
   leaveRoomLocal();
   return;
  }
  isHost = roomData.host === uid;
  render();
 }, e => {
  console.error('onSnapshot Error:', e);
  msg.textContent = '방 동기화 오류: ' + e.message;
 });
 msg.textContent = '';
}

function leaveRoomLocal(){
 unsubscribe?.();
 unsubscribe = null;
 room = ''; roomData = null;
 window.__horseRoomActive = false;
 roomBox.hidden = true;
 setupBox.style.display = 'flex'; // 상단 텍스트박스 복구
 $('singleHorseSetting').classList.remove('hidden');
 $('startBtn').classList.remove('hidden');
 window.raceApi?.reset();
}

// 🚀 [요구사항 2] 방장 전용 경주 시작 트리거 (방장만 호출 가능!)
async function triggerRaceStart(){
 if(!isHost || !room || !roomData || roomData.phase !== 'lobby') return;
 const users = roomData.users || {};
 const players = Object.values(users);
 if(players.length === 0) return;
 
 const horseNum = Number(roomData.horseCount) || 5;
 const seed = Math.floor(Math.random() * 0x7fffffff);
 const precalculated = window.precomputeRace(seed, horseNum);
 const startAt = window.getSyncedTime() + 3500; // 3.5초 카운트다운 보장
 
 try{
  await updateDoc(roomRef(room), {
   phase: 'countdown',
   startedAt: startAt,
   raceSeed: seed,
   precomputedResults: precalculated,
   results: null,
   finishedAt: null
  });
 }catch(e){
  console.error('경주 시작 업데이트 실패:', e);
 }
}

// 🚀 [요구사항 2] 방장 전용: 새 경기 (말 선택부터 다시 시작)
async function resetRoomToLobby(){
 if(!isHost || !room || !roomData) return;
 try{
  const users = roomData.users || {};
  const updates = {
   phase: 'lobby',
   startedAt: null,
   raceSeed: null,
   precomputedResults: null,
   results: null,
   finishedAt: null
  };
  // 모든 참가자의 말 선택(pick/skip) 초기화 -> 말 선택부터 다시 시작!
  for(const id of Object.keys(users)){
   updates[`users.${id}.pick`] = null;
   updates[`users.${id}.skip`] = false;
  }
  await updateDoc(roomRef(room), updates);
 }catch(e){
  console.error('말 선택 재시작 리셋 실패:', e);
 }
}

// 모든 참가자 선택 완료 시 자동 출발 (오직 방장 브라우저만 트리거)
function checkAndAutoStart(){
 if(!isHost || !roomData || roomData.phase !== 'lobby') return;
 const users = roomData.users || {}, players = Object.values(users);
 if(players.length === 0) return;
 const allDone = players.every(u => u.skip || u.pick);
 if(allDone){
  triggerRaceStart();
 }
}

function render(){
 if(!roomData) return;
 const users = roomData.users || {}, players = Object.entries(users);
 playerColors = new Map();
 [...players].sort(([a],[b])=>a.localeCompare(b)).forEach(([id],i)=>playerColors.set(id,`hsl(${Math.round((i*137.508)%360)} 78% 48%)`));
 
 $('mpCount').textContent = players.length;
 $('mpPhase').textContent = ({lobby:'말 선택 중', countdown:'3초 카운트다운', racing:'경기 진행 중', finished:'경기 종료'})[roomData.phase] || '대기 중';
 $('mpHorseCount').value = roomData.horseCount || 5;
 
 // 컨트롤 노출 제어 (오직 방장에게만 노출!)
 $('mpHorseSetting').hidden = !isHost || roomData.phase !== 'lobby';
 $('mpHostStartBtn').hidden = !isHost || roomData.phase !== 'lobby';
 $('mpHostResetBtn').hidden = !isHost || roomData.phase !== 'finished';
 
 if(window.raceApi && window.raceApi.getHorseCount() !== (Number(roomData.horseCount) || 5)){
  window.raceApi.setHorseCount(Number(roomData.horseCount) || 5);
 }
 
 $('startBtn').classList.add('hidden'); // 멀티 중에는 항상 숨김
 
 // 1. 카운트다운 신호 수신 -> 모든 참가자 동시 카운트다운 & 동시 출발!
 if(roomData.phase === 'countdown' && lastPhase !== 'countdown'){
  window.raceApi?.start(roomData.raceSeed, roomData.startedAt, roomData.precomputedResults);
 }
 
 // 2. 🚀 [요구사항 2] 로비 복귀 수신 (말 선택부터 다시 시작)
 if(roomData.phase === 'lobby' && lastPhase !== 'lobby'){
  window.raceApi?.reset();
  $('resultModal').classList.add('hidden');
  $('resultModal').classList.remove('flex');
 }
 
 // 3. 공식 경기 종료 수신
 if(roomData.phase === 'finished' && roomData.results){
  window.raceApi?.completeOfficially(roomData.results);
 }
 lastPhase = roomData.phase;
 
 const readyCount = players.filter(([,u]) => u.pick || u.skip).length;
 $('mpPlayers').innerHTML = players.map(([id,u])=>`
  <span class="inline-flex items-center gap-1 bg-slate-800 px-2 py-0.5 rounded-md text-[10px] sm:text-[11px] border" style="border-color:${playerColors.get(id)}">
   <span class="w-1.5 h-1.5 rounded-full" style="background:${playerColors.get(id)}"></span>
   <span class="font-bold text-slate-200 truncate max-w-[70px]">${esc(u.name)}</span>${id===roomData.host?'<span class="text-amber-400">👑</span>':''}
   <span class="text-slate-400">·</span>
   <span class="${u.pick?'text-amber-400 font-extrabold':u.skip?'text-slate-400':'text-cyan-300 font-semibold'}">${u.skip?'건너뜀':u.pick?u.pick+'번 말':roomData.phase==='lobby'?'선택 대기':'미선택'}</span>
  </span>
 `).join('');
 
 if(roomData.phase === 'lobby'){
  $('mpSkip').disabled = false;
  $('mpPickHint').textContent = `트랙에서 원하는 말을 터치해 고르세요! (선택 완료: ${readyCount}/${players.length}명)`;
  $('mpPickHint').className = 'text-amber-300 font-bold truncate flex-1 min-w-[140px]';
  $('mpPickRow').style.opacity = '1';
  $('mpResults').textContent = '';
 } else if(roomData.phase === 'countdown'){
  $('mpSkip').disabled = true;
  $('mpPickHint').textContent = '🚨 3초 카운트다운 진행 중! 곧 출발합니다!';
  $('mpPickHint').className = 'text-emerald-400 font-extrabold animate-pulse truncate flex-1 min-w-[140px]';
  $('mpPickRow').style.opacity = '.9';
 } else if(roomData.phase === 'finished'){
  $('mpSkip').disabled = true;
  $('mpPickHint').textContent = isHost ? '경기가 종료되었습니다. 아래 버튼을 눌러 새 경기를 시작하세요!' : '경기가 종료되었습니다. 방장의 다음 경기 준비를 기다리세요.';
  $('mpPickHint').className = 'text-amber-400 font-bold truncate flex-1 min-w-[140px]';
 } else {
  $('mpSkip').disabled = true;
  $('mpPickHint').textContent = '🔥 경주가 진행 중입니다!';
  $('mpPickHint').className = 'text-cyan-400 font-bold truncate flex-1 min-w-[140px]';
 }
 
 // 🚀 결과 화면 동기화
 if(roomData.phase === 'finished' && roomData.results){
  const order = roomData.results;
  const byHorse = new Map(order.map((r,i) => [Number(r.horse), i + 1]));
  const ranked = players.filter(([,u]) => u.pick && byHorse.has(Number(u.pick)))
   .map(([id,u]) => ({
    id,
    name: u.name,
    pick: Number(u.pick),
    horseRank: byHorse.get(Number(u.pick))
   }))
   .sort((a,b) => a.horseRank - b.horseRank);
   
  const userRows = ranked.length ? ranked.map((u,i) => `
   <div class="rounded-lg ${i===0?'bg-amber-500/15 border-amber-500/50 text-amber-200 font-extrabold':'bg-slate-950/70 border-slate-800 text-slate-200'} border p-1.5 flex items-center justify-between text-xs">
    <div class="flex items-center gap-1.5 truncate">
     <span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':'🎗️'}</span>
     <span>${i+1}위 <b class="text-white">${esc(u.name)}</b></span>
    </div>
    <span class="text-amber-400 font-bold whitespace-nowrap ml-1">${u.pick}번 말 (${u.horseRank}위 도착)</span>
   </div>
  `).join('') : '<div class="text-slate-400 text-center py-2 text-xs">말을 선택한 참가자가 없습니다.</div>';
  
  const horseRows = order.map((r,i) => {
   const col = COLORS[(r.horse - 1) % COLORS.length];
   return `<div class="flex items-center justify-between text-[11px] py-1 border-b border-slate-800/60">
    <div class="flex items-center gap-1.5">
     <span class="w-4 h-4 rounded-full text-[10px] font-bold flex items-center justify-center text-slate-950" style="background:${col.hex}">${r.horse}</span>
     <span class="text-slate-200">${col.name}</span>
    </div>
    <span class="font-mono text-amber-400 font-bold">${Number(r.time).toFixed(2)}초 (${i+1}위)</span>
   </div>`;
  }).join('');
  
  const markup = `
   <div class="mb-2.5">
    <div class="text-center text-amber-300 font-bold mb-1 text-xs">👑 참가자 최종 순위</div>
    <div class="space-y-1">${userRows}</div>
   </div>
   <div>
    <div class="text-center text-slate-400 font-bold mb-1 text-[11px]">🏇 말 도착 기록</div>
    <div class="max-h-32 overflow-y-auto no-scrollbar space-y-0.5">${horseRows}</div>
   </div>
  `;
  
  $('mpResults').innerHTML = markup;
  $('podiumList').innerHTML = markup;
  const title = document.querySelector('#resultModal h2');
  if(title) title.textContent = '참가자 및 말 최종 순위';
  
  const restartBtn = $('modalRestartBtn');
  restartBtn.textContent = isHost ? '🔄 다음 경기 (말 선택 시작)' : '⏳ 방장의 다음 경기 준비를 기다리는 중...';
  restartBtn.disabled = !isHost;
  restartBtn.className = isHost
   ? "w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-2 rounded-xl font-jua text-xs sm:text-sm border border-amber-300 cursor-pointer shadow-lg"
   : "w-full bg-slate-800 text-slate-400 font-bold py-2 rounded-xl font-jua text-xs border border-slate-700 cursor-not-allowed";
  
  $('resultModal').classList.remove('hidden');
  $('resultModal').classList.add('flex');
 }
 
 checkAndAutoStart();
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
$('mpCreate').onclick=async()=>{try{const c=code();await connect(c,true)}catch(e){msg.textContent=e.message}};
$('mpJoin').onclick=async()=>{try{await connect($('mpCode').value.trim().toUpperCase(),false)}catch(e){msg.textContent=e.message}};
$('mpHostStartBtn').onclick=async()=>{try{await triggerRaceStart()}catch(e){msg.textContent=e.message}};
$('mpHostResetBtn').onclick=async()=>{try{await resetRoomToLobby()}catch(e){msg.textContent=e.message}};

async function chooseHorse(horse){
 if(!uid||!room||roomData?.phase!=='lobby')return;
 const rr=roomRef(room),playerId=uid;
 try{
  await runTransaction(db,async tx=>{
   const snap=await tx.get(rr);
   if(!snap.exists())throw Error('방이 종료되었습니다.');
   const data=snap.data(),users=data.users||{};
   if(data.phase!=='lobby')throw Error('선택 시간이 끝났습니다.');
   const owner=Object.entries(users).find(([id,u])=>id!==playerId&&Number(u.pick)===horse);
   if(owner)throw Error(`${owner[1].name||'다른 유저'}님이 이미 선택한 말입니다.`);
   if(!users[playerId])throw Error('방 참가 상태를 확인할 수 없습니다.');
   tx.update(rr,{['users.'+playerId+'.pick']:horse,['users.'+playerId+'.skip']:false});
  });
  msg.textContent=`${horse}번 말을 선택했습니다.`;
 }catch(e){msg.textContent=e.message}
}

canvas.addEventListener('click',e=>{
 if(!room||roomData?.phase!=='lobby')return;
 const rect=canvas.getBoundingClientRect(),y=(e.clientY-rect.top)*(canvas.height/rect.height),top=55,bottom=canvas.height-15;
 if(y<top||y>=bottom)return;
 const lane=Math.floor((y-top)/((bottom-top)/numHorses));
 if(lane>=0&&lane<numHorses)chooseHorse(lane+1);
});
canvas.style.cursor='pointer';

$('mpSkip').onclick=async()=>{
 if(!uid||!room)return;
 const rr=roomRef(room),playerId=uid;
 try{
  await runTransaction(db,async tx=>{
   const snap=await tx.get(rr);
   if(!snap.exists()||snap.data().phase!=='lobby')throw Error('선택 시간이 끝났습니다.');
   tx.update(rr,{['users.'+playerId+'.pick']:null,['users.'+playerId+'.skip']:true})
  });
  msg.textContent='이번 경기를 건너뜁니다.';
 }catch(e){msg.textContent=e.message}
};

$('mpHorseCount').onchange=()=>isHost&&roomData?.phase==='lobby'&&updateDoc(roomRef(room),{horseCount:Number($('mpHorseCount').value)});

$('mpLeave').onclick=async()=>{
 if(room&&uid){
  if(isHost)await deleteDoc(roomRef(room));
  else await updateDoc(roomRef(room),{['users.'+uid]:deleteField()});
 }
 leaveRoomLocal();
 msg.textContent='방에서 나왔습니다.';
};

// 방장 전용: 모달에서 다음 경기 준비 (말 선택부터 재시작)
window.addEventListener('horse-rematch-requested',async()=>{
 if(!isHost||!room||!roomData)return;
 await resetRoomToLobby();
});

// 경기 완주 시 공식 결과 동기화 (오직 방장만 업데이트)
window.addEventListener('horse-race-finished',async e=>{
 if(isHost&&room&&roomData?.phase==='countdown'){
  const results=e.detail.map(x=>({horse:x.id,time:x.time}));
  await updateDoc(roomRef(room),{phase:'finished',results,finishedAt:Date.now()});
 }
});
</script>
</body>
</html>
